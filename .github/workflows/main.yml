name: Build Dark Controller EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller hidapi

      - name: Check hidapi
        run: python -c "import hid; print('hidapi OK', hid.__file__)"

      - name: Build EXE
        run: pyinstaller --onefile --windowed --hidden-import hid --icon assets/icon.ico --add-data "assets;assets" --name DarkController main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DarkController-exe
          path: dist/DarkController.exe
